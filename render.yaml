services:
  - type: web
    name: sila-md
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: SESSION_ID
        sync: false
      - key: BOT_NAME
        value: SILA-MD
      - key: MODE
        value: public
      - key: PREFIX
        value: .
